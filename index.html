<head>
    <meta charset="UTF-8">

    <title>SPİDEY GANG</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            
            /* Arka plan fotoğrafı ayarı */
            background-image: url('AMUDA.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d1117;
        }

        /* Fotoğraf çok parlaksa yazılar okunsun diye üzerine hafif siyah bir tül çektim */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); /* Koyuluğu buradan ayarlayabilirsin */
            z-index: -1;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-top: 40px;
            z-index: 1;
        }

        .header-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e1306c; 
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(225, 48, 108, 0.7);
            /* Profile fotoğrafı animasyonu */
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 3px;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            animation: fadeIn 1s ease 0.3s backwards;
        }

        /* Cam görünümlü, yarı saydam buton tasarımı */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(22, 27, 34, 0.6);
            backdrop-filter: blur(8px);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            
            /* Aşağıdan yukarı geliş animasyonu */
            animation: fadeInUp 0.5s ease backwards;
        }

        /* Butonların sırayla ekrana gelmesi için gecikmeler */
        .link-btn:nth-of-type(1) { animation-delay: 0.4s; }
        .link-btn:nth-of-type(2) { animation-delay: 0.5s; }
        .link-btn:nth-of-type(3) { animation-delay: 0.6s; }
        .link-btn:nth-of-type(4) { animation-delay: 0.7s; }
        .link-btn:nth-of-type(5) { animation-delay: 0.8s; }
        .link-btn:nth-of-type(6) { animation-delay: 0.9s; }
        .link-btn:nth-of-type(7) { animation-delay: 1.0s; }

        /* Yeni Hover Animasyonu: Büyüme ve Spidey kırmızısı parlama */
        .link-btn:hover {
            transform: scale(1.05) translateY(-5px);
            background: linear-gradient(45deg, #e63946, #dc2743);
            border-color: transparent;
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.6);
            letter-spacing: 1px;
        }

        .ig-icon {
            margin-right: 10px;
            font-size: 1.3rem;
        }

        /* Animasyon Anahtarları (Keyframes) */
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
