<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPİDEY GANG</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            
            background-image: url('AMUDA.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d1117;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); 
            z-index: -1;
        }

        /* --- YENİ: GİRİŞ EKRANI (Splash Screen) --- */
        #girisEkrani {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('AMUDA.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }

        #girisEkrani::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); /* Giriş ekranı daha karanlık */
            z-index: -1;
        }

        .giris-btn {
            background: linear-gradient(45deg, #e63946, #dc2743);
            color: #ffffff;
            border: none;
            padding: 18px 35px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.6);
            transition: all 0.3s ease;
            animation: pulse 1.5s infinite; /* Nefes alma efekti */
            z-index: 1;
        }

        .giris-btn:hover {
            transform: scale(1.1);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 39, 67, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 39, 67, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 39, 67, 0); }
        }

        /* Başlangıçta sitenin asıl halini gizliyoruz */
        #anaIcerik, #sesButonu {
            display: none;
        }

        /* Sağ üstteki Müzik Butonu */
        #sesButonu {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        #sesButonu:hover {
            transform: scale(1.1);
            background: #e1306c;
            border-color: transparent;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-top: 40px;
            z-index: 1;
        }

        .header-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e1306c; 
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(225, 48, 108, 0.7);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 3px;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            animation: fadeIn 1s ease 0.3s backwards;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(22, 27, 34, 0.6);
            backdrop-filter: blur(8px);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.5s ease backwards;
        }

        .link-btn:nth-of-type(1) { animation-delay: 0.2s; }
        .link-btn:nth-of-type(2) { animation-delay: 0.3s; }
        .link-btn:nth-of-type(3) { animation-delay: 0.4s; }
        .link-btn:nth-of-type(4) { animation-delay: 0.5s; }
        .link-btn:nth-of-type(5) { animation-delay: 0.6s; }
        .link-btn:nth-of-type(6) { animation-delay: 0.7s; }
        .link-btn:nth-of-type(7) { animation-delay: 0.8s; }

        .link-btn:hover {
            transform: scale(1.05) translateY(-5px);
            background: linear-gradient(45deg, #e63946, #dc2743);
            border-color: transparent;
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.6);
        }

        .ig-icon { margin-right: 10px; font-size: 1.3rem; }

        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <audio id="arkaMuzik" loop>
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <!-- YENİ: Başlangıçta Ekranda Çıkan Giriş Ekranı -->
    <div id="girisEkrani">
        <button class="giris-btn" onclick="siteyeGir()">🕷️ Müzikle Giriş Yap 🎵</button>
    </div>

    <!-- Sağ Üst Buton -->
    <button id="sesButonu" onclick="sarkiOynatDurdur()">🔊 Sesi Kapat</button>

    <!-- Asıl Site İçeriği -->
    <div id="anaIcerik" class="container">
        <img src="foto.jpg" alt="Spidey Gang Foto" class="header-img">
        <h1>SPİDEY GANG</h1>
        
        <a href="https://www.instagram.com/mustafaabsdr" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @mustafaabsdr</a>
        <a href="https://www.instagram.com/nawwiecosplay" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @nawwiecosplay</a>
        <a href="https://www.instagram.com/kaanert_34" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @kaanert_34</a>
        <a href="https://www.instagram.com/enesbrylcn" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @enesbrylcn</a>
        <a href="https://www.instagram.com/burakerataa" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @burakerataa</a>
        <a href="https://www.instagram.com/abdullahdnmzz" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @abdullahdnmzz</a>
        <a href="https://www.instagram.com/bahagkmn0" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @bahagkmn0</a>
    </div>

    <script>
        var muzik = document.getElementById("arkaMuzik");
        var buton = document.getElementById("sesButonu");
        var girisEkrani = document.getElementById("girisEkrani");
        var anaIcerik = document.getElementById("anaIcerik");
        var caliyor = false;

        // Kullanıcı giriş butonuna bastığında çalışacak fonksiyon
        function siteyeGir() {
            muzik.play(); // Sesi başlat
            caliyor = true;
            
            // Giriş ekranını yavaşça kaybet
            girisEkrani.style.opacity = "0";
            setTimeout(function() {
                girisEkrani.style.display = "none";
                
                // Ana siteyi ve sağ üstteki butonu göster
                anaIcerik.style.display = "block";
                buton.style.display = "block";
            }, 800); // 0.8 saniye (animasyon süresi) bekle
        }

        // Sağ üstteki butona basıldığında çalışacak fonksiyon
        function sarkiOynatDurdur() {
            if (caliyor) {
                muzik.pause();
                buton.innerHTML = "🎵 Sesi Aç";
            } else {
                muzik.play();
                buton.innerHTML = "🔊 Sesi Kapat";
            }
            caliyor = !caliyor;
        }
    </script>

</body>
</html>
