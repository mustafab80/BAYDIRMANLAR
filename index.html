<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPİDEY GANG</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
            
            background-image: url('AMUDA.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d1117;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); 
            z-index: -1;
        }

        #particles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 0; 
        }

        .spider-web {
            position: absolute;
            top: -50px;
            color: rgba(255, 255, 255, 0.3);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        #girisEkrani {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('AMUDA.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }

        #girisEkrani::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); 
            z-index: -1;
        }

        .giris-btn {
            background: linear-gradient(45deg, #e63946, #dc2743);
            color: #ffffff;
            border: none;
            padding: 18px 35px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.6);
            transition: all 0.3s ease;
            animation: pulse 1.5s infinite; 
            z-index: 1;
        }

        .giris-btn:hover { transform: scale(1.1); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 39, 67, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 39, 67, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 39, 67, 0); }
        }

        #anaIcerik, #sesButonu, #oyunButonu { display: none; }

        /* Sağ üst ses butonu */
        #sesButonu {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(5px);
            color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 18px; border-radius: 30px;
            cursor: pointer; z-index: 1000;
            font-weight: bold; font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        #sesButonu:hover { background: #e1306c; transform: scale(1.1); border-color: transparent;}

        /* Sol üst oyun butonu */
        #oyunButonu {
            position: fixed;
            top: 20px; left: 20px;
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(5px);
            color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 18px; border-radius: 30px;
            cursor: pointer; z-index: 1000;
            font-weight: bold; font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        #oyunButonu:hover { background: #e1306c; transform: scale(1.1); border-color: transparent;}

        /* Oyun Ekranı (Modal) */
        #oyunEkrani {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95); z-index: 3000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #oyunKapatBtn {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: 2px solid white; color: white;
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        #oyunAlani {
            width: 90%; max-width: 400px; height: 400px;
            border: 3px solid #e1306c; border-radius: 15px;
            position: relative; overflow: hidden; display: none; margin-top: 20px;
            background: rgba(0,0,0,0.5); box-shadow: 0 0 20px rgba(225, 48, 108, 0.5);
        }
        .hedef {
            position: absolute; font-size: 2.5rem;
            cursor: crosshair; user-select: none;
        }

        .container {
            max-width: 400px; width: 100%;
            text-align: center; margin-top: 40px; z-index: 1;
        }

        .header-img {
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
            border: 4px solid #e1306c; margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(225, 48, 108, 0.7);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        h1 {
            font-size: 2rem; margin-bottom: 30px; color: #ffffff;
            letter-spacing: 3px; font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            animation: fadeIn 1s ease 0.3s backwards;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: center;
            background: rgba(22, 27, 34, 0.6); backdrop-filter: blur(8px);
            color: #ffffff; text-decoration: none;
            padding: 16px 20px; margin-bottom: 16px; border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700; font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.5s ease backwards;
        }
        .link-btn:hover {
            transform: scale(1.05) translateY(-5px);
            background: linear-gradient(45deg, #e63946, #dc2743);
            border-color: transparent;
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.6);
        }

        .ig-icon { margin-right: 10px; font-size: 1.3rem; }

        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <audio id="arkaMuzik" loop>
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <div id="particles-container"></div>

    <div id="girisEkrani">
        <button class="giris-btn" onclick="siteyeGir()">🕷️ Müzikle Giriş Yap 🎵</button>
    </div>

    <!-- Üst Butonlar -->
    <button id="oyunButonu" onclick="oyunuAc()">🎮 Oyunu Oyna</button>
    <button id="sesButonu" onclick="sarkiOynatDurdur()">🔊 Sesi Kapat</button>

    <!-- Oyun Ekranı -->
    <div id="oyunEkrani">
        <button id="oyunKapatBtn" onclick="oyunuKapat()">❌ Kapat</button>
        <h2 style="color:#e1306c;">🕸️ Ağ Fırlatma Eğitimi 🕸️</h2>
        <p style="font-size:1.2rem;">Puan: <span id="puan">0</span> | Kalan Can: <span id="can" style="color:red; font-weight:bold;">3</span></p>
        <button id="oyunBaslatBtn" class="giris-btn" onclick="oyunuBaslat()" style="margin-top:20px; font-size:1.2rem; padding:10px 25px;">BAŞLA!</button>
        <div id="oyunAlani"></div>
    </div>

    <div id="anaIcerik" class="container">
        <img src="foto.jpg" alt="Spidey Gang Foto" class="header-img">
        <h1>SPİDEY GANG</h1>
        
        <a href="https://www.instagram.com/mustafaabsdr" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @mustafaabsdr</a>
        <a href="https://www.instagram.com/nawwiecosplay" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @nawwiecosplay</a>
        <a href="https://www.instagram.com/kaanert_34" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @kaanert_34</a>
        <a href="https://www.instagram.com/enesbrylcn" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @enesbrylcn</a>
        <a href="https://www.instagram.com/burakerataa" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @burakerataa</a>
        <a href="https://www.instagram.com/abdullahdnmzz" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @abdullahdnmzz</a>
        <a href="https://www.instagram.com/bahagkmn0" target="_blank" class="link-btn"><span class="ig-icon">📸</span> @bahagkmn0</a>
    </div>

    <script>
        var muzik = document.getElementById("arkaMuzik");
        var buton = document.getElementById("sesButonu");
        var oyunBtn = document.getElementById("oyunButonu");
        var girisEkrani = document.getElementById("girisEkrani");
        var anaIcerik = document.getElementById("anaIcerik");
        var caliyor = false;

        function siteyeGir() {
            muzik.play(); 
            caliyor = true;
            girisEkrani.style.opacity = "0";
            setTimeout(function() {
                girisEkrani.style.display = "none";
                anaIcerik.style.display = "block";
                buton.style.display = "block";
                oyunBtn.style.display = "block"; // Oyun butonunu göster
                agPartikulleriniOlustur();
            }, 800); 
        }

        function sarkiOynatDurdur() {
            if (caliyor) {
                muzik.pause();
                buton.innerHTML = "🎵 Sesi Aç";
            } else {
                muzik.play();
                buton.innerHTML = "🔊 Sesi Kapat";
            }
            caliyor = !caliyor;
        }

        function agPartikulleriniOlustur() {
            const container = document.getElementById('particles-container');
            for (let i = 0; i < 20; i++) {
                let ag = document.createElement('div');
                ag.classList.add('spider-web');
                ag.innerHTML = '🕸️'; 
                ag.style.left = Math.random() * 100 + 'vw';
                ag.style.animationDuration = (Math.random() * 5 + 5) + 's';
                ag.style.animationDelay = (Math.random() * 5) + 's';
                ag.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(ag);
            }
        }

        // --- OYUN KODLARI ---
        var oyunDongusu;
        var puan = 0;
        var can = 3;
        var hiz = 2;

        function oyunuAc() {
            document.getElementById('oyunEkrani').style.display = 'flex';
        }

        function oyunuKapat() {
            document.getElementById('oyunEkrani').style.display = 'none';
            clearInterval(oyunDongusu);
            document.getElementById('oyunAlani').innerHTML = '';
            document.getElementById('oyunBaslatBtn').style.display = 'block';
            document.getElementById('oyunAlani').style.display = 'none';
        }

        function oyunuBaslat() {
            puan = 0;
            can = 3;
            hiz = 2; // Başlangıç hızı
            document.getElementById('puan').innerText = puan;
            document.getElementById('can').innerText = can;
            
            document.getElementById('oyunBaslatBtn').style.display = 'none';
            const alan = document.getElementById('oyunAlani');
            alan.style.display = 'block';
            alan.innerHTML = '';

            // Her saniye yeni bomba üret
            oyunDongusu = setInterval(function() {
                if(can <= 0) {
                    clearInterval(oyunDongusu);
                    alan.innerHTML = '<h3 style="color:white; margin-top:40%;">OYUN BİTTİ! Puan: '+puan+'</h3>';
                    setTimeout(() => { document.getElementById('oyunBaslatBtn').style.display = 'block'; }, 2000);
                    return;
                }

                let hedef = document.createElement('div');
                hedef.innerText = '🎃';
                hedef.className = 'hedef';
                hedef.style.left = (Math.random() * 80) + '%';
                hedef.style.top = '-50px';
                alan.appendChild(hedef);

                let dusus = -50;
                let dususDongusu = setInterval(function() {
                    dusus += hiz;
                    hedef.style.top = dusus + 'px';

                    // Bomba aşağı düştüyse (Kaçtıysa)
                    if(dusus > 380) {
                        clearInterval(dususDongusu);
                        if(hedef.parentNode) {
                            hedef.remove();
                            can--;
                            document.getElementById('can').innerText = can;
                        }
                    }
                }, 20); // 20 milisaniyede bir hareket et

                // Bombaya tıklandığında (Ağ atıldığında)
                hedef.onmousedown = hedef.ontouchstart = function() {
                    clearInterval(dususDongusu);
                    hedef.innerText = '🕸️'; // Vurulunca ağa dönüşür
                    hedef.style.opacity = '0.5';
                    setTimeout(() => { if(hedef.parentNode) hedef.remove(); }, 300);
                    
                    puan += 10;
                    document.getElementById('puan').innerText = puan;
                    
                    // Puan arttıkça oyun hızlansın
                    if(puan % 50 === 0) hiz += 0.5;
                };
            }, 1000); 
        }
    </script>
</body>
</html>
