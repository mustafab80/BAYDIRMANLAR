<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Grup</title>
    <style>
        /* Genel sayfa ayarları ve Koyu Tema */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-top: 40px;
        }

        /* Yuvarlak grup profil fotoğrafı */
        .header-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e1306c; /* Instagram pembesi detayı */
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(225, 48, 108, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Link butonları tasarımı */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #161b22;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid #30363d;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* Butonun üzerine gelince olacak efektler */
        .link-btn:hover {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-color: transparent;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(225, 48, 108, 0.4);
        }

        .ig-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Grup fotoğrafı için linki buraya ekleyebilirsin -->
        <img src="https://via.placeholder.com/150/161b22/ffffff?text=Grup+Foto" alt="Grup Logosu" class="header-img">
        
        <h1>Bizim Ekip</h1>

        <a href="https://www.instagram.com/nawwiecosplay" target="_blank" class="link-btn">
            <span class="ig-icon">📸</span> @nawwiecosplay
        </a>
        
        <a href="https://www.instagram.com/kaanert_34" target="_blank" class="link-btn">
            <span class="ig-icon">📸</span> @kaanert_34
        </a>

        <a href="https://www.instagram.com/enesbrylcn" target="_blank" class="link-btn">
            <span class="ig-icon">📸</span> @enesbrylcn
        </a>

        <a href="https://www.instagram.com/burakerataa" target="_blank" class="link-btn">
            <span class="ig-icon">📸</span> @burakerataa
        </a>

        <a href="https://www.instagram.com/abdullahdnmzz" target="_blank" class="link-btn">
            <span class="ig-icon">📸</span> @abdullahdnmzz
        </a>

        <a href="https://www.instagram.com/bahagkmn0" target="_blank" class="link-btn">
            <span class="ig-icon">📸</span> @bahagkmn0
        </a>

        <a href="https://www.instagram.com/mustafaabsdr" target="_blank" class="link-btn">
            <span class="ig-icon">📸</span> @mustafaabsdr
        </a>

    </div>

</body>
</html>
